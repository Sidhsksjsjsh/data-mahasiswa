<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Nilai Mahasiswa</title>
    <!-- Menghubungkan file CSS -->
    <link rel="stylesheet" href="clothes.css">
</head>

<body>

<div class="container">

    <h1>INPUT DATA MAHASISWA</h1>
    <h2>Program Nilai Mahasiswa</h2>

    <div class="form-group">
        <label>Nama</label>
        <input type="text" id="nama" placeholder="Masukkan nama">
    </div>

    <div class="form-group">
        <label>NPM</label>
        <input type="text" id="npm" placeholder="Masukkan NPM">
    </div>

    <div class="form-group">
        <label>Nilai Absen</label>
        <input type="number" id="absen" min="0" max="100">
    </div>

    <div class="form-group">
        <label>Nilai Tugas</label>
        <input type="number" id="tugas" min="0" max="100">
    </div>

    <div class="form-group">
        <label>Nilai UTS</label>
        <input type="number" id="uts" min="0" max="100">
    </div>

    <div class="form-group">
        <label>Nilai UAS</label>
        <input type="number" id="uas" min="0" max="100">
    </div>

    <button class="btn-tambah" onclick="tambahMahasiswa()">
        Tambah Data
    </button>

    <button class="btn-reset" onclick="resetData()">
        Reset
    </button>

    <h2>REKAP HASIL NILAI MAHASISWA</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nama</th>
                    <th>NPM</th>
                    <th>Absen</th>
                    <th>Tugas</th>
                    <th>UTS</th>
                    <th>UAS</th>
                    <th>Nilai Akhir</th>
                    <th>Grade</th>
                    <th>Keterangan</th>
                </tr>
            </thead>

            <tbody id="tabelMahasiswa">
            </tbody>
        </table>
    </div>

</div>

<!-- Menghubungkan file JavaScript -->
<script src="script.js"></script>

</body>
</html>
